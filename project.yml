# Xcode 工程定义（由 xcodegen 生成 SDP.xcodeproj）
# 主 App: SDP (SwiftUI 菜单栏代理) + 1 个内嵌 NetworkExtension app extension (SDPNE)
#
# 注意：各 target 的 Info.plist 一律「手写并由 INFOPLIST_FILE 指定」，
# 刻意不使用 xcodegen 的 `info:` 块——它会重写 plist 文件，
# 把 NetworkExtension 必需的 NSExtension / NEProviderClasses 键覆盖掉。
name: SDP
options:
  bundleIdPrefix: com.alick.sdp-proxy
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  # app extension 形态：用 Automatic 签名，让 Xcode 自动挑/生成带
  # packet-tunnel-provider 能力的 Developer ID profile（手动指定旧 profile
  # 只授权 -systemextension 变体，会把这个 entitlement 在签名时剥掉）。
  setPerTargetBuildVariables: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 语言模式默认启用 complete 严格并发；SWIFT_STRICT_CONCURRENCY=minimal
    # 无法压住区域隔离（RBI）检查，故源码已按 Swift 6 规范修正（ResumeOnce / @unchecked Sendable）。
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: KLU8GF65GP
    CODE_SIGN_STYLE: Automatic
    # 第三方静态库（hev / lwip / yaml）只有 arm64 切片，且目标机器均为 Apple Silicon，
    # 故只打 arm64；打通用二进制会在 x86_64 链接阶段因缺切片失败。
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    COMBINE_HIDPI_IMAGES: "YES"
    # 版本号的唯一来源：宿主 App 与 app extension 的 Info.plist 都引用这两个变量。
    # app extension 的 CFBundleVersion 必须与宿主 App 完全一致，否则
    # embeddedBinaryValidationUtility 会告警、且 NE 可能拒绝加载该扩展。
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "200"
    LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    # 公证要求：签名必须带「安全时间戳」，否则 notarytool 直接拒绝
    # （报 "The signature does not include a secure timestamp"）。
    # 同时系统扩展在 macOS 26+ 上也只允许「已公证」的宿主 App 激活。
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
  configs:
    # Release（Developer ID 分发）：不注入 get-task-allow，否则产物可被调试且无法公证
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

targets:
  # ---------------------------------------------------------------------------
  # 主 App
  # ---------------------------------------------------------------------------
  SDP:
    type: application
    platform: macOS
    sources:
      - path: macapp
        excludes:
          - "SDP.entitlements"
      # Icon Composer 的 .icon 直接作为资源输入。
      # .icon 在 Xcode 内部被视作「抽象 asset catalog」（folder.iconcomposer.icon
      # based on folder.abstractassetcatalog），actool 直接吃 .icon 目录本身，
      # 产出带 Aqua / DarkAqua / Tintable 三套外观的 IconImageStack + 兼容用 AppIcon.icns。
      # 切勿把它拍平成 appiconset——那会丢掉亮/暗/透明自适应。
      - path: assets/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alick.sdp-proxy
        PRODUCT_NAME: SDP
        INFOPLIST_FILE: assets/SDP-Info.plist
        CODE_SIGN_ENTITLEMENTS: macapp/SDP.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_LDFLAGS:
          - "-framework SwiftUI"
          - "-framework AppKit"
          - "-framework WebKit"
          - "-framework Network"
          - "-framework Security"
          - "-framework CryptoKit"
          - "-framework NetworkExtension"
    # 合并后只有一个 tunnel provider：三个功能由 providerConfiguration["features"] 控制。
    # 用普通 app extension（.appex）而不是 SystemExtension —— 后者会在
    # 「系统设置 > 登录项与扩展」按 bundle ID 永久留一个开关，还要求用户批准/重启。
    dependencies:
      - target: SDPNE
        embed: true

  # ---------------------------------------------------------------------------
  # SDPNE: 透明代理 NetworkExtension app extension（基于 hev 静态库）
  # ---------------------------------------------------------------------------
  SDPNE:
    type: app-extension
    platform: macOS
    sources:
      # app extension 由系统按 NSExtensionPrincipalClass 实例化，
      # 不需要 ne/main.swift 里的 NEProvider.startSystemExtensionMode()。
      - path: ne/bridge.h
      - path: Tools/TSBridgeRuntime.swift
      # Tailscale 引擎的桥接契约（TailscaleRuntime / TSTunnelSettings / 消息路由）
      - path: ne/TailscaleRuntime.swift
      # 合并用的一次性入口：MergedProvider + 分类器 + 三个引擎适配层
      - path: ne/Merged
      - path: macapp/Core/RuleStore.swift
      - path: macapp/Core/RuleText.swift
      - path: macapp/Core/Streams.swift
      - path: macapp/Core/SharedToken.swift
      - path: macapp/Core/Gateway.swift
      - path: macapp/Core/DNS.swift
      - path: macapp/Core/Config.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alick.sdp-proxy.tunnel
        # app extension 的 wrapper 是 Contents/PlugIns/SDPNE.appex
        PRODUCT_NAME: SDPNE
        EXECUTABLE_NAME: SDPNE
        PRODUCT_MODULE_NAME: SDPNE
        INFOPLIST_FILE: ne/Info.plist
        CODE_SIGN_ENTITLEMENTS: ne/SDPNE.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ne/bridge.h
        HEADER_SEARCH_PATHS: ["ne", "third_party/hev/lib"]
        LIBRARY_SEARCH_PATHS: ["third_party/hev/lib"]
        OTHER_LDFLAGS: ["-lhev-socks5-tunnel", "-lhev-task-system", "-llwip", "-lyaml", "-framework NetworkExtension", "-framework Network", "-framework Security", "-framework Tsbridge"]
        # 统一 Go 桥接框架（tsnet + wireguard-go 同包，共享一份 cgo 运行时）
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "Vendor/Tsbridge.xcframework/macos-arm64_x86_64"
        ENABLE_HARDENED_RUNTIME: "YES"
